name: Monitor Flota DTPM

on:
  # Disparador principal: cron-job.org llama a la API de GitHub cada 10 min
  # (workflow_dispatch). El cron de GitHub es poco confiable para
  # frecuencias altas: en la práctica corría ~4 veces al día.
  workflow_dispatch:
  # Respaldo: si el disparador externo falla, al menos una captura cada 3 horas
  # (cuando GitHub la lance). Era cada hora, pero GitHub la lanza con atraso y
  # caía encima de las de cron-job.org (capturas repetidas o en cola canceladas).
  schedule:
    - cron: '17 */3 * * *'

# Nunca dos capturas a la vez: evita choques al publicar los datos.
concurrency:
  group: monitor-dtpm
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
    - name: Checkout código (main)
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # Los datos viven en la rama `data`, que se reescribe en cada captura
    # (un solo commit, sin historial) para que el repo no crezca.
    # Si la rama aún no existe, se usan los parquet que hay en main.
    - name: Traer datos actuales (rama data)
      run: |
        if git ls-remote --exit-code --heads origin data > /dev/null; then
          git fetch --depth 1 origin data
          git checkout FETCH_HEAD -- data/metricas_historicas.parquet data/datos_recientes.parquet
          echo "Datos tomados de la rama data"
        else
          echo "Rama data no existe aún: se usan los parquet de main"
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install pandas pyarrow requests

    - name: Run monitor
      id: monitor
      env:
        DTPM_USUARIO: ${{ secrets.DTPM_USUARIO }}
        DTPM_CLAVE: ${{ secrets.DTPM_CLAVE }}
      run: python scripts/monitor.py

    # Solo si hubo una captura nueva (monitor.py descarta las repetidas)
    - name: Publicar datos en la rama data (sin historial)
      if: steps.monitor.outputs.nuevo == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        PUB=$(mktemp -d)
        mkdir -p "$PUB/data"
        cp data/metricas_historicas.parquet data/datos_recientes.parquet "$PUB/data/"
        # Análisis por línea: el último que publicó analisis-lineas.yaml; si no hay, el de main
        gh release download analisis-lineas -D pagina --clobber -p lineas.json -p data_estatico.json \
          || echo "Sin Release analisis-lineas: se usa el análisis de main"
        # Dashboard (GitHub Pages sirve la raíz de esta rama): página + datos livianos
        cp pagina/index.html pagina/data_estatico.json pagina/lineas.json "$PUB/"
        python scripts/generar_datos_artifact.py "$PUB/data_vivo.json"
        touch "$PUB/.nojekyll"
        cp data/README.md "$PUB/README.md"
        cd "$PUB"
        git init -q -b data
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git add .
        git commit -q -m "📊 Datos: $(date -u '+%Y-%m-%d %H:%M UTC')"
        git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        echo "Datos publicados en la rama data"
